services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER erforderlich (siehe .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD erforderlich (siehe .env)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB erforderlich (siehe .env)}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEV_CREATE_ALL: ${DEV_CREATE_ALL:-true}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN erforderlich (siehe .env)}
      DEPLOYER_URL: ${DEPLOYER_URL:-http://deployer:8661}
      SHOTTER_URL: ${SHOTTER_URL:-http://shotter:8700}
      FILMER_URL: ${FILMER_URL:-http://filmer:8710}
      WORKSPACE_ROOT: /workspace
      WORKSPACE_HOST_PATH: ${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH erforderlich (siehe .env)}
      TESTENV_HOST: ${TESTENV_HOST:-localhost}
      TELEGRAM_OWNER_CHAT: ${TELEGRAM_OWNER_CHAT:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MCPJUNGLE_BASE: ${MCPJUNGLE_BASE:-http://mcpjungle:8080}
      MCPJUNGLE_ADMIN_TOKEN: ${MCPJUNGLE_ADMIN_TOKEN:-}
    ports:
      - "${BACKEND_PORT:-8800}:8800"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # Ohne diese Zeile testet `docker compose exec backend pytest` die Kopie aus dem Image
      # — die veraltet still und meldet Grün für Code, der so gar nicht mehr existiert.
      - ./backend/tests:/app/tests
      - ./data/workspace:/workspace   # Repo-Browser/Editor (api/repo.py) liest/schreibt hier
      # Medienablage für Telegram: hier SCHREIBT das Backend, der telegram-bot LIEST.
      # Beide Mounts gehören zusammen — fehlt er drüben, findet der Bot die Datei nie
      # und die Nachricht geht (still, aber ohne Film) als Text raus.
      - ./data/film:/data/film
    networks:
      default:
        aliases:
          - traccoon-backend   # eindeutig, damit das Frontend am proxy-Netz nicht kollidiert
      mcp-backends: {}         # erreicht mcpjungle:8080 (Self-Service-MCP-Provisionierung)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8800", "--reload"]

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      WORKSPACE_ROOT: /workspace
      DEPLOYER_URL: ${DEPLOYER_URL:-http://deployer:8661}
      SHOTTER_URL: ${SHOTTER_URL:-http://shotter:8700}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN erforderlich (siehe .env)}
      MCP_GATEWAY_URL: ${MCP_GATEWAY_URL:-}
      MCP_GATEWAY_TOKEN: ${MCP_GATEWAY_TOKEN:-}
      MCPJUNGLE_BASE: ${MCPJUNGLE_BASE:-http://mcpjungle:8080}
      DEFAULT_CLAUDE_MODEL: ${DEFAULT_CLAUDE_MODEL:-claude-sonnet-4-5}
      DEFAULT_CODEX_MODEL: ${DEFAULT_CODEX_MODEL:-gpt-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
    volumes:
      - ./backend/app:/app/app
      - ./data/workspace:/workspace
    networks: [default, mcp-backends]
    command: ["python", "-m", "app.worker"]

  telegram-bot:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:-}
      TELEGRAM_OWNER_CHAT: ${TELEGRAM_OWNER_CHAT:-}
      # Sprachnachrichten: lokaler Transkriptions-Container (kein Cloud-Aufruf, siehe `whisper`
      # unten) — kein Audio verlässt das Haus.
      WHISPER_URL: ${WHISPER_URL:-http://whisper:9000}
      TELEGRAM_VOICE_MAX_SECONDS: ${TELEGRAM_VOICE_MAX_SECONDS:-600}
      # 19 MB Default (< Telegram-Bot-API-Hardlimit 20 MB für getFile/Download ohne eigenen
      # Bot-API-Server) — darüber würde der Download scheitern statt der klaren "zu groß"-
      # Meldung, siehe Kommentar in app/bot/__main__.py.
      TELEGRAM_VOICE_MAX_BYTES: ${TELEGRAM_VOICE_MAX_BYTES:-19922944}
    volumes:
      - ./backend/app:/app/app
      # Lesend: `Notification.media_path` zeigt hierher. Ohne diesen Mount fällt der
      # Notifier bei JEDER Medien-Nachricht auf Text zurück, ohne dass irgendwo etwas
      # kaputtgeht — genau deshalb steht der Hinweis hier und nicht nur drüben.
      - ./data/film:/data/film:ro
    networks: [default, mcp-backends]   # mcp-backends: banking-mcp für 2FA-OTP-Reply erreichbar
    command: ["python", "-m", "app.bot"]

  # Lokale Sprache→Text für Telegram-Sprachnachrichten (faster-whisper unter der Haube).
  # Bewusst im eigenen Haus statt Cloud-API: kein Audio verlässt den Server, keine laufenden
  # Kosten pro Minute. `ASR_ENGINE=faster_whisper` ist der schnelle CPU-Pfad des Images.
  # Modell per WHISPER_MODEL wählbar (default "small" — guter Deutsch-Kompromiss aus
  # Genauigkeit und CPU-Zeit ohne GPU).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      # Modell-Cache: ohne diesen Mount lädt der Container das Modell (small ≈ 500 MB) bei
      # JEDEM Neustart neu aus dem Netz — mit Mount bleibt es über Neustarts erhalten.
      - ./data/whisper:/root/.cache/whisper
    # Explizit im `default`-Netz (kein eigener Eintrag nötig, Compose würde das auch ohne
    # diese Zeile so setzen — hier bewusst sichtbar, weil genau darüber `telegram-bot` den
    # Container unter `http://whisper:9000` erreicht; kein Port nach außen, kein Cloud-Zugriff).
    networks:
      - default
    # `/docs` statt eines dedizierten `/health`: das Image (FastAPI/Swagger) garantiert diesen
    # Pfad immer, ein `/health`-Endpunkt ist beim faster-whisper-Image nicht dokumentiert.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  shotter:
    build: ./shotter
    restart: unless-stopped
    environment:
      SHOTTER_PORT: "8700"
      SHOT_BASE_URL: ${SHOT_BASE_URL:-}
      SHOT_LOGIN_EMAIL: ${SHOT_LOGIN_EMAIL:-}
      SHOT_LOGIN_PASSWORD: ${SHOT_LOGIN_PASSWORD:-}
      SHOT_TOKEN_KEY: ${SHOT_TOKEN_KEY:-}

  # Der Renderer des Feierabendfilms. Gebaut aus dem `frontend/`-Kontext, weil er genau dessen
  # Schichten 0 und 1 ausführt (Engine, Replay, Pixelzeichnung) — dieselben Dateien, die im
  # Browser das Büro malen, ohne Browser. Kein npm, kein Port nach außen, keine Zugangsdaten:
  # das Backend schickt den Ereignis-Log mit und bekommt ein GIF zurück.
  filmer:
    build:
      context: ./frontend
      dockerfile: Dockerfile.filmer
    restart: unless-stopped

  deployer:
    build: ./deployer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SELF_STACK_DIR: ${SELF_STACK_DIR:?SELF_STACK_DIR erforderlich (siehe .env)}
      SELF_SERVICES: "backend worker frontend"
      HEALTH_URL: http://backend:8800/api/health
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN erforderlich (siehe .env)}
      PREVIEW_MEMORY: ${PREVIEW_MEMORY:-2g}
      PREVIEW_CPUS: ${PREVIEW_CPUS:-2}
      # Testumgebungen (ABC-18): Build-Deckel + Wartezeit der Liveness-Nachpruefung.
      # Portbereich/Grenzen kommen zur Laufzeit aus den globalen Einstellungen (Admin).
      TESTENV_MAX_BUILDS: ${TESTENV_MAX_BUILDS:-2}
      TESTENV_LIVENESS_WAIT: ${TESTENV_LIVENESS_WAIT:-6}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_STACKS_DIR:?DOCKER_STACKS_DIR erforderlich (siehe .env)}:${DOCKER_STACKS_DIR}
      - ./deployer/deploy_watch.py:/deploy_watch.py:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.traccoon.rule=Host(`${TRACCOON_HOST:?TRACCOON_HOST erforderlich (siehe .env)}`)"
      - "traefik.http.routers.traccoon.entrypoints=websecure"
      - "traefik.http.routers.traccoon.tls.certresolver=le"
      - "traefik.http.services.traccoon.loadbalancer.server.port=80"

networks:
  default:
  mcp-backends:
    external: true
  proxy:
    external: true
