services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required (see .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required (see .env)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required (see .env)}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-720}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      DEV_CREATE_ALL: ${DEV_CREATE_ALL:-true}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN required (see .env)}
      DEPLOYER_URL: ${DEPLOYER_URL:-http://deployer:8661}
      SHOTTER_URL: ${SHOTTER_URL:-http://shotter:8700}
      FILMER_URL: ${FILMER_URL:-http://filmer:8710}
      WORKSPACE_ROOT: /workspace
      WORKSPACE_HOST_PATH: ${WORKSPACE_HOST_PATH:?WORKSPACE_HOST_PATH required (see .env)}
      TESTENV_HOST: ${TESTENV_HOST:-localhost}
      TELEGRAM_OWNER_CHAT: ${TELEGRAM_OWNER_CHAT:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      MCPJUNGLE_BASE: ${MCPJUNGLE_BASE:-http://mcpjungle:8080}
      MCPJUNGLE_ADMIN_TOKEN: ${MCPJUNGLE_ADMIN_TOKEN:-}
      VAULT_PATH: /vault
      IMAP_MCP_URL: ${IMAP_MCP_URL:-http://imap-mcp:3010/mcp}
    ports:
      - "${BACKEND_PORT:-8800}:8800"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      # Without this line `docker compose exec backend pytest` tests the copy from the image
      # — which goes stale quietly and reports green for code that no longer exists.
      - ./backend/tests:/app/tests
      # Maintenance scripts (imports, one-off conversions). Mounted and not baked into the
      # image: they run by hand, often exactly once, and should be the version from the working
      # directory while they do.
      - ./backend/scripts:/app/scripts
      - ./data/workspace:/workspace   # the repo browser/editor (api/repo.py) reads and writes here
      # Media store for Telegram: the backend WRITES here, the telegram-bot READS.
      # Both mounts belong together — if it is missing over there, the bot never finds the file
      # and the message goes out as text (quietly, but without the film).
      - ./data/film:/data/film
      # Obsidian vault READ ONLY: the spam detection pulls the known addresses out of it
      # (the acquittal list). The vault is a Syncthing replica — writing into it here would mean
      # writing against Obsidian and the sync.
      - ${VAULT_HOST_PATH:-/opt/docker/stacks/syncthing/data/sync/Sync/Obsidian/Second Brain}:/vault:ro
    networks:
      default:
        aliases:
          - traccoon-backend   # unique, so the frontend on the proxy network does not collide
      mcp-backends: {}         # reaches mcpjungle:8080 (self-service MCP provisioning)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8800", "--reload"]

  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      WORKSPACE_ROOT: /workspace
      DEPLOYER_URL: ${DEPLOYER_URL:-http://deployer:8661}
      SHOTTER_URL: ${SHOTTER_URL:-http://shotter:8700}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN required (see .env)}
      MCP_GATEWAY_URL: ${MCP_GATEWAY_URL:-}
      MCP_GATEWAY_TOKEN: ${MCP_GATEWAY_TOKEN:-}
      MCPJUNGLE_BASE: ${MCPJUNGLE_BASE:-http://mcpjungle:8080}
      DEFAULT_CLAUDE_MODEL: ${DEFAULT_CLAUDE_MODEL:-claude-sonnet-4-5}
      DEFAULT_CODEX_MODEL: ${DEFAULT_CODEX_MODEL:-gpt-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      # So the worker recognises a hopeless request before queueing it: a deploy onto Traccoon
      # itself is refused by the deployer on principle (`runtime.deploy_locked`).
      SELF_STACK_DIR: ${SELF_STACK_DIR:-}
      WORKER_DRAIN_SEC: ${WORKER_DRAIN_SEC:-120}
    # Has to be above WORKER_DRAIN_SEC: on SIGTERM the worker takes no new assignments and
    # lets the running ones drain. Without this grace period Docker killed after 10 s — and with
    # it every agent in mid-move.
    stop_grace_period: 150s
    volumes:
      - ./backend/app:/app/app
      - ./data/workspace:/workspace
    networks: [default, mcp-backends]
    command: ["python", "-m", "app.worker"]

  telegram-bot:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:-}
      TELEGRAM_OWNER_CHAT: ${TELEGRAM_OWNER_CHAT:-}
      # Voice messages: a local transcription container (no cloud call, see `whisper` below) —
      # no audio leaves the house.
      WHISPER_URL: ${WHISPER_URL:-http://whisper:9000}
      TELEGRAM_VOICE_MAX_SECONDS: ${TELEGRAM_VOICE_MAX_SECONDS:-600}
      # 19 MB default (< the Telegram bot API hard limit of 20 MB for getFile/download without
      # a bot API server of one's own) — above that the download would fail instead of giving the
      # clear "too large" message, see the comment in app/bot/__main__.py.
      TELEGRAM_VOICE_MAX_BYTES: ${TELEGRAM_VOICE_MAX_BYTES:-19922944}
      # Proper nouns Whisper cannot know (products, projects, ticket prefixes) — they travel
      # along as the `initial_prompt`. Without them even the large model hears "Trakon".
      TELEGRAM_VOICE_VOCABULARY: ${TELEGRAM_VOICE_VOCABULARY:-${TELEGRAM_VOICE_VOKABULAR:-}}
      # Qwen3-ASR on the iGPU as the first choice; Whisper stays reachable as the fallback.
      ASR_URL: ${ASR_URL:-http://asr-gpu:9100}
      # The bot moves confirmed spam decisions itself over IMAP-MCP — starting an agent run for
      # that would be expensive and slow for a flick of the wrist.
      IMAP_MCP_URL: ${IMAP_MCP_URL:-http://imap-mcp:3010/mcp}
    volumes:
      - ./backend/app:/app/app
      # Read only: `Notification.media_path` points here. Without this mount the notifier falls
      # back to text on EVERY media message without anything breaking anywhere — which is exactly
      # why the hint stands here and not only over there.
      - ./data/film:/data/film:ro
    networks: [default, mcp-backends]   # mcp-backends: banking-mcp reachable for the 2FA OTP reply
    command: ["python", "-m", "app.bot"]

  # Local speech→text for Telegram voice messages (faster-whisper under the hood).
  # Deliberately in our own house instead of a cloud API: no audio leaves the server, no running
  # cost per minute. `ASR_ENGINE=faster_whisper` is the fast CPU path of the image.
  # The model is chosen with WHISPER_MODEL (default "small" — a good compromise between accuracy
  # and CPU time without a GPU).
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${WHISPER_MODEL:-small}
    volumes:
      # Model cache: without this mount the container downloads the model (small ≈ 500 MB) on
      # EVERY restart — with it, it survives restarts.
      - ./data/whisper:/root/.cache/whisper
    # Explicitly on the `default` network (no entry of its own would be needed, Compose would do
    # this without the line — deliberately visible here, because that is exactly how `telegram-bot`
    # reaches the container at `http://whisper:9000`; no port outwards, no cloud access).
    networks:
      - default
    # `/docs` statt eines dedizierten `/health`: das Image (FastAPI/Swagger) garantiert diesen
    # Pfad immer, ein `/health`-Endpunkt ist beim faster-whisper-Image nicht dokumentiert.
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:9000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # The same thing in fast: whisper.cpp on the iGPU (Radeon 8060S) instead of faster-whisper on
  # the CPU. The reason for the second service is the substructure — CTranslate2 (faster-whisper)
  # speaks CUDA only, and on an AMD card it is left with the CPU. ggml/Vulkan can use it. Device
  # binding 1:1 as in the llama.cpp RPC container already running on the same chip.
  whisper-gpu:
    build:
      context: ./whisper-gpu
    restart: unless-stopped
    devices:
      - /dev/dri
    group_add:
      - video
    environment:
      # The large model — the whole point of the GPU: accuracy without the waiting time it would
      # cost on the CPU.
      WHISPER_MODEL: ${WHISPER_GPU_MODEL:-large-v3}
      WHISPER_LANG: ${WHISPER_GPU_LANG:-de}
      # whisper.cpp searches GREEDILY out of the box (`--beam-size -1`), faster-whisper with beam
      # 5 — that is what the first comparison came down to, not the model: "Drakon" instead of
      # "Traccoon", "Spermel" instead of "Sperrmuell". The GPU has the headroom (it was 3x faster).
      WHISPER_EXTRA_ARGS: ${WHISPER_GPU_ARGS:---beam-size 5 --best-of 5}
    volumes:
      # Modelle liegen neben den Daten, nicht im Image (large-v3 ≈ 3 GB).
      - ./data/whisper-gpu:/models
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s      # the first start downloads the model

  # Qwen3-ASR on the iGPU — a language model with an audio input instead of a pure transcriber.
  # Measured on 2026-08-07: whisper.cpp was fast on the same GPU but mangled proper nouns; Qwen
  # understands the context in the prompt instead of brushing past it.
  asr-gpu:
    build:
      context: ./asr-gpu
    restart: unless-stopped
    devices:
      - /dev/dri
    group_add:
      - video
    environment:
      ASR_QUANT: ${ASR_QUANT:-Q8_0}
    volumes:
      - ./data/asr-gpu:/models
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9100/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s      # the first start downloads the model plus the audio projector

  shotter:
    build: ./shotter
    restart: unless-stopped
    environment:
      SHOTTER_PORT: "8700"
      SHOT_BASE_URL: ${SHOT_BASE_URL:-}
      SHOT_LOGIN_EMAIL: ${SHOT_LOGIN_EMAIL:-}
      SHOT_LOGIN_PASSWORD: ${SHOT_LOGIN_PASSWORD:-}
      SHOT_TOKEN_KEY: ${SHOT_TOKEN_KEY:-}

  # The renderer of the end-of-day film. Built from the `frontend/` context because it runs
  # exactly its layers 0 and 1 (engine, replay, pixel drawing) — the same files that paint the
  # office in the browser, without a browser. No npm, no port outwards, no credentials: the
  # backend sends the event log along and gets a GIF back.
  filmer:
    build:
      context: ./frontend
      dockerfile: Dockerfile.filmer
    restart: unless-stopped

  deployer:
    build: ./deployer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SELF_STACK_DIR: ${SELF_STACK_DIR:?SELF_STACK_DIR required (see .env)}
      SELF_SERVICES: "backend worker frontend"
      HEALTH_URL: http://backend:8800/api/health
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN required (see .env)}
      PREVIEW_MEMORY: ${PREVIEW_MEMORY:-2g}
      PREVIEW_CPUS: ${PREVIEW_CPUS:-2}
      # Testumgebungen (ABC-18): Build-Deckel + Wartezeit der Liveness-Nachpruefung.
      # Portbereich/Grenzen kommen zur Laufzeit aus den globalen Einstellungen (Admin).
      TESTENV_MAX_BUILDS: ${TESTENV_MAX_BUILDS:-2}
      TESTENV_LIVENESS_WAIT: ${TESTENV_LIVENESS_WAIT:-6}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_STACKS_DIR:?DOCKER_STACKS_DIR required (see .env)}:${DOCKER_STACKS_DIR}
      - ./deployer/deploy_watch.py:/deploy_watch.py:ro

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.traccoon.rule=Host(`${TRACCOON_HOST:?TRACCOON_HOST required (see .env)}`)"
      - "traefik.http.routers.traccoon.entrypoints=websecure"
      - "traefik.http.routers.traccoon.tls.certresolver=le"
      - "traefik.http.services.traccoon.loadbalancer.server.port=80"

networks:
  default:
  mcp-backends:
    external: true
  proxy:
    external: true
