server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Dockers eingebautes DNS. Ohne resolver+Variable loest nginx den Upstream nur
    # einmal beim Start auf — nach einem Backend-Neustart zeigt es dann auf eine
    # tote IP und liefert 502, bis auch nginx neu startet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Eindeutiger Alias statt bloß "backend" — das Frontend hängt am geteilten
        # proxy-Netz, wo ein fremder Container ebenfalls den Alias "backend" trägt.
        set $backend_upstream http://traccoon-backend:8800;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Die Bundle-Namen tragen einen Inhalts-Hash — sie sind unveraenderlich und duerfen
    # beliebig lange im Browser liegen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # index.html dagegen NIE ohne Rueckfrage aus dem Cache: sie ist der einzige Verweis
        # auf den aktuellen Bundle-Namen. Ohne Cache-Control cachen Browser sie heuristisch
        # (ETag/Last-Modified allein genuegt ihnen nicht als Aufforderung nachzufragen) und
        # zeigen nach einem Deploy weiter die alte Oberflaeche — genau so blieb das neue
        # Job-Parameterfeld unsichtbar, obwohl es laengst ausgeliefert war.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
