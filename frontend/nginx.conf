server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS. Without resolver+variable nginx resolves the upstream only once at
    # startup — after a backend restart it then points at a dead IP and answers 502 until nginx
    # is restarted as well.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # A unique alias instead of plain "backend" — the frontend hangs on the shared proxy
        # network, where a foreign container carries the alias "backend" as well.
        set $backend_upstream http://traccoon-backend:8800;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # The bundle names carry a content hash — they are immutable and may
    # beliebig lange im Browser liegen.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # index.html on the other hand NEVER from the cache without asking: it is the only
        # reference to the current bundle name. Without Cache-Control browsers cache it
        # heuristically (ETag/Last-Modified alone is no invitation to ask) and keep showing the
        # old interface after a deploy — that is exactly how the new
        # Job-Parameterfeld unsichtbar, obwohl es laengst ausgeliefert war.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
