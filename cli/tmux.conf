# The browser terminal is the only screen: no status bar, mouse wheel scrolls the history.
set -g status off
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
# Several tabs of the same person: the window follows the most recent one, not the smallest.
set -g window-size latest
set -g escape-time 10
# Claude Code uses focus reporting (it said so in the pane without it).
set -g focus-events on
